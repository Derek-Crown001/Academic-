name: Build and Release Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          java -version
          echo "JAVA_HOME is: $JAVA_HOME"
          JAVA_MAJOR=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}' | awk -F '.' '{print ($1 == "1" ? $2 : $1)}')
          echo "Detected Java major version: $JAVA_MAJOR"
          if [ -z "$JAVA_MAJOR" ]; then
            echo "ERROR: Could not detect Java major version."
            exit 1
          fi
          if [ "$JAVA_MAJOR" -lt 17 ]; then
            echo "ERROR: Active Java major version ($JAVA_MAJOR) is lower than 17."
            exit 1
          fi
          echo "Java 17 or newer successfully verified ($JAVA_MAJOR)."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ -f "./debug.keystore" ]; then
            echo "./debug.keystore already exists. Skipping generation."
          else
            echo "Generating temporary debug keystore..."
            keytool -genkey -v \
              -keystore "./debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          if [ ! -f "./debug.keystore" ]; then
            echo "ERROR: ./debug.keystore does not exist after generation."
            exit 1
          fi
          echo "Temporary debug keystore verified."

      - name: Build debug APK
        run: |
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK
        run: |
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$EXPECTED_APK" ]; then
            echo "ERROR: Expected APK not found at: $EXPECTED_APK"
            echo "Searching only inside app/build/outputs/apk:"
            if [ -d "app/build/outputs/apk" ]; then
              find app/build/outputs/apk -type f -name "*.apk"
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            exit 1
          fi
          if [ ! -s "$EXPECTED_APK" ]; then
            echo "ERROR: $EXPECTED_APK is empty."
            exit 1
          fi
          case "$EXPECTED_APK" in
            *.apk) ;;
            *) echo "ERROR: $EXPECTED_APK does not have .apk extension"; exit 1 ;;
          esac
          echo "Debug APK verified successfully: $EXPECTED_APK"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          ASSET_DIR="${RUNNER_TEMP}/apk-release-asset"
          mkdir -p "$ASSET_DIR"
          REPO_RAW="${{ github.event.repository.name }}"
          if [ -z "$REPO_RAW" ]; then
            REPO_RAW="android-app"
          fi
          REPO_SAFE=$(echo "$REPO_RAW" | tr '[:upper:]' '[:lower:]' | tr -c 'a-z0-9._-' '-')
          ASSET_FILENAME="${REPO_SAFE}-debug-build-${{ github.run_number }}.apk"
          ASSET_PATH="${ASSET_DIR}/${ASSET_FILENAME}"
          cp -f "app/build/outputs/apk/debug/app-debug.apk" "$ASSET_PATH"
          if [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "ERROR: Prepared release asset is missing or empty at: $ASSET_PATH"
            exit 1
          fi
          echo "Prepared release asset: $ASSET_PATH"
          echo "asset_path=$ASSET_PATH" >> "$GITHUB_OUTPUT"
          echo "asset_filename=$ASSET_FILENAME" >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh --version
          ASSET_PATH="${{ steps.prepare_asset.outputs.asset_path }}"
          if [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "ERROR: Release asset does not exist or is empty: $ASSET_PATH"
            exit 1
          fi
          RELEASE_TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="Debug APK Build #${{ github.run_number }}"
          RELEASE_NOTES=$(cat << 'EOF'
          ### Debug APK Build
          This is an automatically generated debug APK.
          - **Built by**: GitHub Actions
          - **Run number**: ${{ github.run_number }}
          - **Run attempt**: ${{ github.run_attempt }}
          - **Source commit SHA**: ${{ github.sha }}
          
          > **Note**: This APK is intended for testing. The APK is not a Play Store production release. The APK is signed only with a temporary debug keystore.
          EOF
          )

          gh release create "$RELEASE_TAG" "$ASSET_PATH" \
            --target "${{ github.sha }}" \
            --title "$RELEASE_TITLE" \
            --notes "$RELEASE_NOTES" \
            --latest

          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "release_title=$RELEASE_TITLE" >> "$GITHUB_OUTPUT"

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="Debug APK Build #${{ github.run_number }}"
          ASSET_FILENAME="${{ steps.prepare_asset.outputs.asset_filename }}"

          if [ "${{ steps.publish_release.outcome }}" = "success" ]; then
            echo "=== GitHub Release Succeeded ==="
            gh release view "$RELEASE_TAG"
            echo "Release tag: $RELEASE_TAG"
            echo "Release title: $RELEASE_TITLE"
            RELEASE_URL="https://github.com/${{ github.repository }}/releases/tag/${RELEASE_TAG}"
            echo "Direct release URL: $RELEASE_URL"
            echo "APK asset filename: $ASSET_FILENAME"

            cat << EOF >> "$GITHUB_STEP_SUMMARY"
          ## 🚀 Debug APK Build & Release: Succeeded
          - **Release Tag**: \`$RELEASE_TAG\`
          - **Release Title**: $RELEASE_TITLE
          - **Download APK**: [View GitHub Release]($RELEASE_URL)
          - **APK Filename**: \`$ASSET_FILENAME\`

          The APK can be downloaded directly from the **Assets** section of the release page on any phone or device.
          *Note: The Actions artifact named \`app-debug-apk\` is also available as a backup.*
          EOF
          else
            echo "::warning::GitHub Release publishing did not succeed or was skipped."
            echo "APK build succeeded and the GitHub Actions artifact 'app-debug-apk' remains available for download."

            cat << EOF >> "$GITHUB_STEP_SUMMARY"
          ## ⚠️ Debug APK Build: Succeeded (Release Publishing Failed/Skipped)
          - The APK build succeeded.
          - GitHub Actions artifact **\`app-debug-apk\`** remains available for download under the workflow run summary.
          - Check repository permissions for GitHub Actions (needs Read and write permissions under Settings > Actions > General > Workflow permissions).
          EOF
          fi
